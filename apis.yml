name: iQIYI
description: >-
  iQIYI is one of China's largest online video streaming and entertainment platforms,
  delivering movies, TV dramas, variety shows, animation, documentaries, and original
  content across web, mobile (Android/iOS), and OTT/smart-TV devices. Beyond its
  consumer service, iQIYI runs a SaaS / OTT developer platform that lets partners
  launch their own branded streaming service with a RESTful API covering Video,
  Channel, Album, Search, and Player resources, plus AVOD/SVOD/TVOD monetization,
  analytics, audience management, and DRM. iQIYI also operates the QIYU XR developer
  platform for VR/AR device applications and maintains an active open-source GitHub
  organization. This profile entered the API Evangelist network as a portfolio lead
  of Hongshan and has been enriched from iQIYI's public developer surface.
